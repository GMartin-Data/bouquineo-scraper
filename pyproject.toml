[project]
name = "scraping"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "scrapy>=2.18.0",
]

[dependency-groups]
dev = [
    "bpython>=0.26",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Flat application layout (not an installed package): put the repo root on
# sys.path so tests can import the bouquineo package.
pythonpath = ["."]
