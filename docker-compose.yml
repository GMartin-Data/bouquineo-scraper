services:
  postgres:
    image: postgres:17
    container_name: bouquineo-db
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bouquineo}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
